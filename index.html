<!DOCTYPE html>
<html>
<head>
    <title>Google Maps Example</title>
</head>
<body>
    <h2>My Google Map</h2>
    <!-- Simple embed using iframe -->
    <iframe
        width="600"
        height="450"
        style="border:0"
        loading="lazy"
        allowfullscreen
        referrerpolicy="no-referrer-when-downgrade"
        src="https://www.google.com/maps/embed/v1/place?key=YOUR_API_KEY&q=Eiffel+Tower,Paris+France">
    </iframe>
</body>
</html>
